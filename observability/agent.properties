# Opt-in local telemetry. Set OTEL_EXPORTER_OTLP_ENDPOINT for a different private collector.
otel.service.name=auctionhouse
otel.exporter.otlp.endpoint=http://127.0.0.1:4318
otel.exporter.otlp.protocol=http/protobuf
otel.traces.exporter=otlp
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.propagators=tracecontext
otel.traces.sampler=parentbased_always_on
otel.metric.export.interval=5000
otel.bsp.schedule.delay=1000
otel.blrp.schedule.delay=1000
otel.instrumentation.micrometer.enabled=true
otel.instrumentation.micrometer.prometheus-mode.enabled=true
otel.instrumentation.common.db.query-sanitization.enabled=true
otel.instrumentation.http.server.capture-request-headers=
otel.instrumentation.http.server.capture-response-headers=
otel.instrumentation.http.client.capture-request-headers=
otel.instrumentation.http.client.capture-response-headers=
otel.instrumentation.logback-appender.enabled=true
