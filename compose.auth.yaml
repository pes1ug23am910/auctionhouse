services:
  keycloak:
    # Keycloak 26.7.4 official linux/amd64 manifest; disposable local development only.
    image: quay.io/keycloak/keycloak@sha256:3d911baa186f352563854039b95f21a7e2c01c76b527fdc64f24a0885b927bdf
    platform: linux/amd64
    profiles: [auth]
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./test-fixtures/keycloak/auctionhouse-local-realm.json:/opt/keycloak/data/import/auctionhouse-local-realm.json:ro
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 20s
