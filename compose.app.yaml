# Standalone local immutable release fixture; do not merge with compose.yaml.
name: auctionhouse-release
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: auctionhouse
      POSTGRES_USER: auctionhouse
      POSTGRES_PASSWORD: ${AUCTIONHOUSE_DB_PASSWORD:?Set a local fixture database password}
    volumes:
      - release-postgres:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U auctionhouse -d auctionhouse]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    cpus: 1
  migrate:
    image: ${AUCTIONHOUSE_IMAGE:?Use an immutable image digest or local image ID}
    command: [migrate]
    environment: &db
      AUCTIONHOUSE_DB_URL: jdbc:postgresql://postgres:5432/auctionhouse
      AUCTIONHOUSE_DB_USER: auctionhouse
      AUCTIONHOUSE_DB_PASSWORD: ${AUCTIONHOUSE_DB_PASSWORD}
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    profiles: [migration]
  app:
    image: ${AUCTIONHOUSE_IMAGE:?Use an immutable image digest or local image ID}
    environment:
      <<: *db
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      SPRING_FLYWAY_ENABLED: 'false'
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auctionhouse
      AUCTIONHOUSE_DEMO_PASSWORD_HASH: ${AUCTIONHOUSE_DEMO_PASSWORD_HASH:-}
    ports:
      - '127.0.0.1:${AUCTIONHOUSE_HTTP_PORT:-18080}:8080'
    networks: [database, edge]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 768m
    cpus: 1
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  database: {internal: true}
  edge: {}
volumes:
  release-postgres: {}
