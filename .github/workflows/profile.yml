name: Bounded contention profiling (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Test profiling analysis and build one immutable application
        run: |
          python -m unittest discover -s experiments/profile -p 'test_*.py' -v
          bash ./gradlew --no-daemon bootJar
      - name: Fetch the checksum-pinned telemetry agent
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.31.1/opentelemetry-javaagent.jar \
            --output "$RUNNER_TEMP/opentelemetry-javaagent.jar"
          echo "bbf83c151b6400709e2f225bdd07a04f839d9d13b8b93464241333fd25d3e3ba  $RUNNER_TEMP/opentelemetry-javaagent.jar" | sha256sum --check
      - name: Generate disposable credentials without command-line secrets
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/profile-fixture"
          mkdir -p "$fixture_dir"
          unzip -j build/libs/auctionhouse.jar 'BOOT-INF/lib/spring-security-crypto-*.jar' -d "$fixture_dir" >/dev/null
          cat > "$fixture_dir/FixtureCredential.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.SecureRandom;
          import java.util.Base64;
          import org.springframework.security.crypto.bcrypt.BCrypt;
          class FixtureCredential {
            static String random() {
              byte[] bytes = new byte[32];
              new SecureRandom().nextBytes(bytes);
              return Base64.getUrlEncoder().withoutPadding().encodeToString(bytes);
            }
            public static void main(String[] args) throws Exception {
              String password = random(), database = random();
              String hash = BCrypt.hashpw(password, BCrypt.gensalt(10));
              for (String value : new String[]{password, hash, database}) {
                System.out.println("::add-mask::" + value);
              }
              Files.writeString(Path.of(System.getenv("GITHUB_ENV")),
                  "AUCTIONHOUSE_DEMO_PASSWORD=" + password + "\n"
                  + "AUCTIONHOUSE_DEMO_PASSWORD_HASH=" + hash + "\n"
                  + "AUCTIONHOUSE_DB_PASSWORD=" + database + "\n", StandardOpenOption.APPEND);
            }
          }
          JAVA
          java -cp "$fixture_dir/*" "$fixture_dir/FixtureCredential.java"
      - name: Run all four diagnostics and retain threshold failures
        id: campaign
        run: python experiments/profile/run.py --output "$RUNNER_TEMP/profile-report" --agent "$RUNNER_TEMP/opentelemetry-javaagent.jar"
      - name: Upload only privacy-checked diagnostic artifacts
        if: ${{ always() && steps.campaign.outputs.upload_safe == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profile-report/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
      - name: Performance acceptance (separate from diagnostic execution)
        if: ${{ always() && steps.campaign.outputs.upload_safe == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          report = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'profile-report/campaign.json').read_text())
          attained = report['allMeasuredPerformanceGatesMet'] is True
          print('All four measured load/latency gates attained:', attained)
          sys.exit(0 if attained else 1)
          PY
