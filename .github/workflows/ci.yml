name: Build and integration tests across modules
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUCTIONHOUSE_TEST_FORKS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Build and unit tests
        run: bash ./gradlew --no-daemon build
      - name: PostgreSQL integration tests
        run: bash ./gradlew --no-daemon integrationTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Chromium accessibility, session, and owner-action fixtures
        run: npx playwright test e2e/catalog-fixture.spec.ts e2e/session-fixture.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-fixture-reports
          path: frontend/playwright-report/
          if-no-files-found: warn

  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - name: Build and test authenticated fan-out and backpressure
        run: npm test

  warehouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: warehouse
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      DBT_USE_COLORS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: warehouse/requirements.lock
      - name: Install the pinned ingestion and dbt dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Ingestion, reconciliation, rebuild, and actual dbt build
        run: python -m pytest -q --junitxml=test-results/warehouse.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: warehouse-test-reports
          path: warehouse/test-results/
          if-no-files-found: warn

  browser-full-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUCTIONHOUSE_DB_PASSWORD: disposable-browser-database-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend and install Chromium
        run: |
          bash ./gradlew --no-daemon bootJar
          npm --prefix frontend ci
          cd frontend
          npx playwright install --with-deps chromium
      - name: Generate fresh demo credentials for this run
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/auctionhouse-fixture"
          mkdir -p "$fixture_dir"
          unzip -j build/libs/auctionhouse.jar 'BOOT-INF/lib/spring-security-crypto-*.jar' -d "$fixture_dir" >/dev/null
          cat > "$fixture_dir/FixtureCredential.java" <<'JAVA'
          import java.nio.file.*;
          import java.security.SecureRandom;
          import java.util.Base64;
          import org.springframework.security.crypto.bcrypt.BCrypt;
          class FixtureCredential {
            public static void main(String[] args) throws Exception {
              byte[] random = new byte[32];
              new SecureRandom().nextBytes(random);
              String password = Base64.getUrlEncoder().withoutPadding().encodeToString(random);
              String hash = BCrypt.hashpw(password, BCrypt.gensalt(10));
              System.out.println("::add-mask::" + password);
              System.out.println("::add-mask::" + hash);
              Files.writeString(Path.of(System.getenv("GITHUB_ENV")),
                  "AUCTIONHOUSE_DEMO_PASSWORD=" + password + "\n"
                  + "AUCTIONHOUSE_DEMO_PASSWORD_HASH=" + hash + "\n", StandardOpenOption.APPEND);
            }
          }
          JAVA
          java -cp "$fixture_dir/*" "$fixture_dir/FixtureCredential.java"
      - name: Start the isolated database and application
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --wait postgres
          java -jar build/libs/auctionhouse.jar --spring.profiles.active=local > "$RUNNER_TEMP/browser-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/browser-backend.pid"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready" >&2
          exit 1
      - name: Real create, publish, bid, disconnect, reconnect, and deadline close
        working-directory: frontend
        # Traces include authenticated network payloads; keep this credential-bearing run untraced.
        run: npx playwright test e2e/auction.spec.ts --trace=off --reporter=line
      - name: Stop the disposable stack
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/browser-backend.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/browser-backend.pid")" || true
          fi
          docker compose down -v
