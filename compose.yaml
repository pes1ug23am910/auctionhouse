name: auctionhouse
services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: auctionhouse
      POSTGRES_USER: auctionhouse
      POSTGRES_PASSWORD: ${AUCTIONHOUSE_DB_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${AUCTIONHOUSE_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctionhouse -d auctionhouse"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 2
volumes:
  postgres-data:
